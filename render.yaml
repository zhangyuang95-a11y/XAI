services:
  - type: web
    name: policylens-warehouse-study
    runtime: python
    plan: free
    region: singapore
    buildCommand: python -m pip install -r requirements-render.txt
    startCommand: python -m ui.warehouse_alignment_r42_server --release-module ui.warehouse_alignment_r42_release --base64 /etc/secrets/warehouse_alignment_release.b64
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: WAREHOUSE_RELEASE_PACKAGE_SHA256
        value: b10ff9d56cbb0687f215e28fccd978a362115442a5c3d49329061b0fd0d12267
      - key: WAREHOUSE_RELEASE_MANIFEST_SHA256
        value: 66e7f3850c5ab3eadb9acb0ad814152ebb202b4e5fd0466ac11cb61d888ba555
      - key: WAREHOUSE_ONLINE_DATABASE
        value: /tmp/warehouse_alignment_online.sqlite3
      - key: WAREHOUSE_STORAGE_MODE
        value: ephemeral
      - key: WAREHOUSE_PUBLIC_ORIGIN
        value: https://policylens-warehouse-study.onrender.com
