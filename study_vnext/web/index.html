<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PolicyLens · 研究流程验证</title><link rel="stylesheet" href="/study-assets/styles.css"><script src="/study-assets/board.js" defer></script><script src="/study-assets/preview-board.js" defer></script><script src="/study-assets/input-queue.js" defer></script><script src="/study-assets/app.js" defer></script></head><body><main>
<header><h1>人–AI 合作研究</h1><p id="mode">正在连接…</p><p>当前为研究者流程验证，正式招募关闭。测试记录不计入真人研究。</p></header>
<form id="entry"><h2>开始研究者测试</h2><label>研究者访问密钥<input id="admin" type="password" autocomplete="off" required></label><label>测试编号<input id="reference" maxlength="100" required></label><label>游戏<select id="domain"><option value="warehouse">Warehouse</option><option value="pong">Pong</option><option value="kitchen">Kitchen</option></select></label><label>测试组别<select id="group"><option value="">平衡随机分配</option><option value="A">A</option><option value="B">B</option><option value="C">C</option></select></label><label><input type="checkbox" id="consent" required> 我同意记录本次研究者测试的操作、问题及问卷。不输入个人信息。</label><label><input type="checkbox" id="transmission-consent"> 我另外同意在研究者明确启用语言服务时，将本次问题及必要公开事实发送给该服务。不同意时使用本地证据模板。</label><button id="enroll">绑定并开始</button></form>
<p id="status" role="status" aria-live="polite"></p><button id="retry" hidden>重试原动作</button>
<section id="workspace" hidden><h2 id="stage"></h2><p id="progress"></p><section id="practice" hidden><h3>中立操作练习</h3><p>此区域只练习按键，不运行队友或研究任务。请点击练习区域，再分别按下提示键。</p><div id="practice-pad" tabindex="0" role="application" aria-label="按键练习区域"><p id="practice-status"></p><p id="practice-marker">●</p></div><button id="practice-finish" disabled>保存操作练习</button></section><button id="demo">播放所绑定模型的双 NN 演示</button><button id="demo-finish" hidden>确认演示，准备 Task 1</button><button id="next" hidden>开始下一任务</button>
<div class="layout"><div><canvas id="board" tabindex="0" aria-label="合作游戏棋盘，WASD移动，空格等待，Kitchen按E操作"></canvas><p id="score"></p><p id="instructions"></p><p id="input-feedback" aria-live="polite"></p><div id="controls"><button data-action="up">W ↑</button><button data-action="left">A ←</button><button data-action="wait">空格 等待</button><button data-action="right">D →</button><button data-action="down">S ↓</button><button data-action="interact">E 操作</button></div></div>
<aside><h3>历史回放</h3><label>任务<select id="replay-task"><option value="1">Task 1</option><option value="2">Task 2</option><option value="3">Task 3</option></select></label><button id="replay">读取已发生的回合</button><label>回合<input id="replay-turn" type="range" min="0" max="0" value="0"></label><button id="live">返回当前任务</button><p id="history-label"></p>
<section id="qa" hidden><h3>询问已经发生的合作</h3><p>只解释已执行动作，不预告队友的下一步。</p><form id="question-form"><label>历史任务<select id="question-task"><option value="1">Task 1</option><option value="2">Task 2</option></select></label><label>第几步（从1开始）<input id="question-step" type="number" min="1" value="1" required></label><label>你的问题<textarea id="question" maxlength="1000" required></textarea></label><label>反事实：仅替换这一步你的动作<select id="alternative"><option value="">不模拟</option><option value="wait">等待</option><option value="up">上移</option><option value="down">下移</option><option value="left">左移</option><option value="right">右移</option><option value="interact">操作工位（E）</option></select></label><button id="ask">提交问题</button></form><button id="restore-answers" type="button">恢复已保存回答</button><button id="read-answers" type="button" hidden>阅读已保存回答</button><div id="answers" aria-live="polite"></div></section></aside></div>
<form id="survey" hidden><h2>三个任务已结束</h2><p>以下评分为1–7分。</p><div id="ratings"></div><fieldset id="understanding"><legend>操作规则理解</legend><p>以下为待试测的规则理解题，不代表已验证的理解量表。</p><div id="understanding-items"></div></fieldset><label>其他反馈（可选）<textarea id="feedback" maxlength="2000"></textarea></label><button id="submit-survey">提交问卷</button></form><p id="finished" hidden>本次研究者测试已完成，记录已保存。此结果不代表真人效果。</p>
<details><summary>绑定身份</summary><pre id="binding"></pre></details></section></main></body></html>
