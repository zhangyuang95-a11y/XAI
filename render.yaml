services:
  - type: web
    name: policylens-warehouse-study
    runtime: python
    plan: free
    region: singapore
    buildCommand: python -m pip install -r requirements-render.txt
    startCommand: python -m ui.warehouse_alignment_online_server --release-module ui.warehouse_alignment_r41_diagnostic_release_v9 --base64 /etc/secrets/warehouse_alignment_release.b64
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: WAREHOUSE_RELEASE_PACKAGE_SHA256
        value: 575857e512fb2161ca0cff823baeb99a693518cfaf758b0cc879ef886e75946a
      - key: WAREHOUSE_RELEASE_MANIFEST_SHA256
        value: d033338d946de37122d86604ba613571e98b56cad8623860bcdb6adba9af195a
      - key: WAREHOUSE_ONLINE_DATABASE
        value: /tmp/warehouse_alignment_online.sqlite3
      - key: WAREHOUSE_STORAGE_MODE
        value: ephemeral
      - key: WAREHOUSE_PUBLIC_ORIGIN
        value: https://policylens-warehouse-study.onrender.com
