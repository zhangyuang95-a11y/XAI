[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rcpd-core"
version = "0.1.0"
description = "Neural policy extraction and bounded program feedback with generic PPO"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2", "scikit-learn>=1.3", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["core*", "training*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
