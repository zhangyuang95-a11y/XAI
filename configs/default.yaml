seed: 2026
hidden: 128
max_steps: 500000
max_minutes: 0
rollout_steps: 256
checkpoint_interval: 50000
actor_lr: 0.0003
critic_lr: 0.0003
ppo:
  gamma: 0.99
  gae_lambda: 0.95
  clip: 0.2
  epochs: 4
  minibatch_size: 128
  entropy: 0.01
  max_grad_norm: 0.5
feedback:
  enabled: true
  warmup_steps: 10000
  interval: 5000
  minimum_partition_samples: 16
  extraction:
    max_depth: 5
    max_leaf_nodes: 16
    max_predicates: 64
    min_samples_leaf: 8
    regularization_lambda: 0.01
    maximum_regularization_lambda: 0.05
    minimum_overall_fidelity_for_feedback: 0.90
    maximum_mean_kl_for_feedback: 0.10
    complexity_penalty: 0.001
    random_seed: 2026
