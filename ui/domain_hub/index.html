<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f4ff">
  <title>PolicyLens · 选择实验</title>
  <link rel="stylesheet" href="/domain-hub.css">
</head>
<body>
  <main>
    <header>
      <span class="eyebrow">PolicyLens · 内部预实验</span>
      <h1>选择合作任务</h1>
      <p>两个任务独立记录。请选择要开始的实验。</p>
    </header>
    <section class="choices" aria-label="实验选择">
      <a class="choice warehouse" href="/warehouse/">
        <span class="icon" aria-hidden="true">▦</span>
        <span class="kind">Warehouse</span>
        <strong>双机器人协作配送</strong>
        <span>在仓库中取货、交付、充电，并与机器人队友协作。</span>
        <b>进入配送实验 →</b>
      </a>
      <a class="choice pong" href="/pong/">
        <span class="icon" aria-hidden="true">▣</span>
        <span class="kind">Cooperative Pong</span>
        <strong>合作接球</strong>
        <span>与机器人队友一起接住小球和需要合拢的大球。</span>
        <b>进入接球实验 →</b>
      </a>
    </section>
    <p class="note">两项实验都仍为内部预实验。</p>
  </main>
</body>
</html>
